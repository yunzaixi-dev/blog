name: blog-dev
services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      network: host
    init: true
    volumes:
      - ..:/workspaces/blog:cached
      - node-modules:/workspaces/blog/node_modules
    environment:
      DEV_PORT: '45100'
      DEV_HOST: 0.0.0.0
      API_PORT: '45101'
      DATABASE_URL: postgres://blog:blog-local-only@postgres:5432/blog?sslmode=disable
      TYPESENSE_URL: http://typesense:8108
      TYPESENSE_API_KEY: blog-local-typesense-only
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      R2_BUCKET: blog-test-media
      S3_ACCESS_KEY_ID: blog-local-only
      S3_SECRET_ACCESS_KEY: blog-local-secret-only
      S3_FORCE_PATH_STYLE: 'true'
      MEDIA_BASE_URL: http://localhost:45104/blog-test-media
      CORS_ORIGINS: http://localhost:45100,http://127.0.0.1:45100
    ports:
      - 127.0.0.1:45100:45100
      - 127.0.0.1:45101:45101
    depends_on:
      postgres: {condition: service_healthy}
      typesense: {condition: service_healthy}
      minio: {condition: service_healthy}
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: blog-local-only
      POSTGRES_DB: blog
    ports: [127.0.0.1:45102:5432]
    volumes: [postgres-data:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U blog -d blog']
      interval: 2s
      timeout: 5s
      retries: 30
  typesense:
    image: typesense/typesense:29.0@sha256:316b7e71c21f7e5e5caa8daa150e1b3f2be8c876081ee1f77bc2d92cd7f137d0
    command: [--data-dir=/data, --api-key=blog-local-typesense-only, --enable-cors=false]
    ports: [127.0.0.1:45103:8108]
    volumes: [typesense-data:/data]
    healthcheck:
      test: [CMD, /bin/bash, -ec, 'exec 3<>/dev/tcp/127.0.0.1/8108; printf "GET /health HTTP/1.0\r\n\r\n" >&3; read -r status <&3; [[ "$$status" == *"200"* ]]']
      interval: 2s
      timeout: 5s
      retries: 30
  minio:
    # Keep the service DNS name for existing local S3_ENDPOINT callers.
    image: chrislusf/seaweedfs:4.17@sha256:186de7ef977a20343ee9a5544073f081976a29e2d29ecf8379891e7bf177fbe9
    command: [mini, -dir=/data, -s3.port=9000, -admin.port=9001, -s3.config=/etc/seaweedfs/s3.json, -master.telemetry=false]
    ports: [127.0.0.1:45104:9000, 127.0.0.1:45105:9001]
    volumes:
      - seaweedfs-data:/data
      - ./s3-local.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:9000/healthz]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  node-modules:
  postgres-data:
  typesense-data:
  minio-data:
  seaweedfs-data:

name: release-artifact
on:
  push:
    branches: [main, dev]
    paths-ignore: ["content/**", "public/static/images/**", "docs/**", "README.md", "LICENSE"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .node-version, cache: pnpm }
      - uses: actions/setup-go@v5
        with: { go-version: "1.26.x" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
      - run: pnpm build
      - run: pnpm test:runtime
      - run: pnpm test:e2e
      - run: pnpm test:e2e:parity
      - run: pnpm quality:html && pnpm size:budget
      - name: Package runtime and private worker dependencies
        run: tar -czf blog-runtime.tar.gz dist out node_modules package.json
      - uses: actions/upload-artifact@v4
        with:
          name: blog-runtime-${{ github.sha }}
          path: blog-runtime.tar.gz

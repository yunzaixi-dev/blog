name: sengi-release
on:
  push:
    branches: [main, dev]
    paths-ignore: ["content/**", "public/static/images/**", "public/forum/**", "deploy/**", "docs/**", "README.md", "LICENSE"]
  pull_request:
    paths-ignore: ["content/**", "public/static/images/**", "public/forum/**", "deploy/**", "docs/**", "README.md", "LICENSE"]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Locally verified full source SHA
        required: true
        type: string
      image_digest:
        description: Already published Zot sha256 digest (no image transfer or build)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: sengi-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  release-check:
    runs-on: sengi-standard-2-ubuntu-2404
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.commit_sha || github.sha }}
      - name: Check the exact source without building or running tests
        env:
          SOURCE_SHA: ${{ inputs.commit_sha || github.sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git show --format= --check HEAD
      - name: Verify the already published manifest
        if: github.event_name == 'workflow_dispatch'
        env:
          DIGEST: ${{ inputs.image_digest }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          curl --fail --silent --show-error --max-time 10 \
            --user "$REGISTRY_USERNAME:$REGISTRY_PASSWORD" \
            --head "https://harbor.agentwego.com/v2/zaixi/blog/manifests/$DIGEST" > manifest-headers.txt
          tr -d '\r' < manifest-headers.txt | grep -iFx "Docker-Content-Digest: $DIGEST"
          printf 'Existing image: `harbor.agentwego.com/zaixi/blog@%s`\n' "$DIGEST" >> "$GITHUB_STEP_SUMMARY"

name: deploy
on:
  push:
    branches: [main]
    paths-ignore: ["README.md", "**/*.md.bak", ".gitignore", "LICENSE"]
  workflow_dispatch:
concurrency: { group: deploy, cancel-in-progress: true }
env:
  HUGO_VERSION: 0.168.0
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - name: Build
        run: |
          curl -fsSL https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz | tar xz -C /tmp hugo
          /tmp/hugo --minify
      - name: Deploy (Pages Direct Upload)
        run: python3 scripts/pages_deploy.py public zaixi-blog main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

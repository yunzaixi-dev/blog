name: deploy
on:
  push:
    branches: [main, dev]
    paths-ignore: ["README.md", "**/*.md.bak", ".gitignore", "LICENSE"]
  workflow_dispatch:
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true
env:
  HUGO_VERSION: 0.168.0
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - name: Build
        run: |
          curl -fsSL https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz | tar xz -C /tmp hugo
          if [ "$GITHUB_REF_NAME" = main ]; then /tmp/hugo --minify
          else HUGO_PARAMS_NOINDEX=true /tmp/hugo --minify --baseURL "https://$GITHUB_REF_NAME.zaixi.dev/"; fi
      - name: Deploy (Pages Direct Upload)
        run: python3 scripts/pages_deploy.py public zaixi-blog "$GITHUB_REF_NAME"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

name: sengi-release
on:
  push:
    branches: [main, dev]
    paths-ignore: ["content/**", "public/static/images/**", "public/forum/**", "deploy/**", "docs/**", "README.md", "LICENSE"]
  pull_request:
    paths-ignore: ["content/**", "public/static/images/**", "public/forum/**", "deploy/**", "docs/**", "README.md", "LICENSE"]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Locally verified full commit SHA to build, smoke-test and publish
        required: true
        type: string
      deploy_pages:
        description: Publish Pages only after this backend revision is live and verified
        type: boolean
        default: false
permissions: {}
concurrency:
  group: sengi-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: sengi-standard-2-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.commit_sha || github.sha }}
      - name: Bind all artifacts to the same locally verified commit
        id: source
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha || github.sha }}
        run: |
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
          echo "sha=$REQUESTED_SHA" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build the Pages shell against the production API
        env:
          API_BASE_URL: https://api.zaixi.dev
          MEDIA_BASE_URL: https://blog-media.zaixi.dev
          SITE_URL: https://zaixi.dev
        run: |
          pnpm exec vite build
          node scripts/prepare-pages.mjs
          node scripts/test-pages-artifact.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: blog-pages-${{ steps.source.outputs.sha }}
          path: out
          include-hidden-files: true
          if-no-files-found: error
  image:
    needs: verify
    runs-on: sengi-standard-4-ubuntu-2404
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      IMAGE: ghcr.io/yunzaixi-dev/blog:${{ needs.verify.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version-file: .node-version }
      - uses: docker/setup-buildx-action@v3
      - name: Build the actual runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.revision=${{ needs.verify.outputs.sha }}
            org.opencontainers.image.source=https://github.com/yunzaixi-dev/blog
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the built image with independent mounted content
        run: node scripts/test-container.mjs "$IMAGE"
      - name: Save the exact smoke-tested image for publication
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: docker save --output blog-image.tar "$IMAGE"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        with:
          name: blog-container-${{ needs.verify.outputs.sha }}
          path: blog-image.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
  publish:
    needs: [verify, image]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: sengi-standard-2-ubuntu-2404
    timeout-minutes: 15
    permissions:
      packages: write
    env:
      IMAGE: ghcr.io/yunzaixi-dev/blog:${{ needs.verify.outputs.sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: blog-container-${{ needs.verify.outputs.sha }}
      - name: Load the smoke-tested image without executing source or rebuilding
        run: docker load --input blog-image.tar
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the exact smoke-tested image and record its digest
        env:
          SOURCE_SHA: ${{ needs.verify.outputs.sha }}
        run: |
          docker push "$IMAGE"
          PIN=$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}')
          [[ "$PIN" =~ ^ghcr.io/yunzaixi-dev/blog@sha256:[0-9a-f]{64}$ ]]
          printf '%s\n' "$PIN" > image-digest.txt
          printf 'Source: `%s`\n\nFlux image pin: `%s`\n' "$SOURCE_SHA" "$PIN" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: blog-image-${{ needs.verify.outputs.sha }}
          path: image-digest.txt
          if-no-files-found: error
  pages:
    needs: [verify, image]
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_pages
    runs-on: sengi-standard-2-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: blog-pages-${{ needs.verify.outputs.sha }}
          path: out
      - name: Upload the verified Pages shell to the existing project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SOURCE_SHA: ${{ needs.verify.outputs.sha }}
        run: python3 scripts/pages_deploy.py out zaixi-blog main

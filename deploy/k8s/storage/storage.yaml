apiVersion: v1
kind: Namespace
metadata:
  name: blog
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: blog-local
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
provisioner: kubernetes.io/no-provisioner
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: blog-content-prod-sg-db-03
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: blog-local
  hostPath:
    path: /var/lib/kubelet/blog-content
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [prod-sg-db-03]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: blog-content
  namespace: blog
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: blog-local
  volumeName: blog-content-prod-sg-db-03
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: blog-typesense-prod-sg-db-03
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  capacity:
    storage: 5Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: blog-local
  hostPath:
    path: /var/lib/kubelet/blog-typesense
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [prod-sg-db-03]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: blog-typesense
  namespace: blog
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: blog-local
  volumeName: blog-typesense-prod-sg-db-03
  resources:
    requests:
      storage: 5Gi
